# lightning.pytorch==2.0.0
seed_everything: true

trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 32
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: 'logs'
      name: 'domainnet'
  log_every_n_steps: 5
  max_epochs: 1
  enable_checkpointing: False

model:
  class_path: networks.SourceModule
  init_args:
    rejection_threshold: 0.5
    feature_dim: 256
    ckpt_dir: 'source_models/domainnet/real_source/source_model_OPDA/checkpoints/source_ckpt.pt'

data:
  class_path: datasets.DomainNetDataModule
  init_args:
    batch_size: 64
    category_shift: 'OPDA'
    train_domain: real
    test_domain: clipart
